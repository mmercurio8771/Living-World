# Builds the app and publishes it to GitHub Pages on every push.
# The first step switches the repository's Pages source to "GitHub Actions" if it
# is still on "Deploy from a branch", so no manual settings change is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/living-world-ecosystem-0gf4hf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point GitHub Pages at this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || echo "Could not change the Pages source automatically; set Settings → Pages → Source to GitHub Actions."
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
